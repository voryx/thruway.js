# Job `interop`: build, then the interop project — RxJS 5.4.3 / 5.5.12 / 6.6.7 / 7.8.2 / 9.0.0-beta.1 (npm aliases
# rxjs543, rxjs5, rxjs6, rxjs, rxjs9), plain positional subscribe, and every load order of RxJS 5/6/7/9 before and after
# thruway.js (child processes on the built package, ESM and CJS). Node >= 22.13 (RxJS 9 beta), on the dev floor and
# every supported line. The same steps as the `interop` stage of scripts/ci.mjs.
name: interop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: interop (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Interop project
        run: npm run test:interop
