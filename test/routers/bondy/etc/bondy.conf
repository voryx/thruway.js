## Minimal Bondy config for thruway.js v3 integration / fuzz testing.
## Single node, no clustering, no TLS. Container-internal ports (start.sh maps them to 1810x on 127.0.0.1).
## Erlang node name/cookie come from BONDY_ERL_NODENAME / BONDY_ERL_DISTRIBUTED_COOKIE (set in start.sh)

## Realms, users, auth sources and grants (realm1 = permissive test realm)
security.config_file = /bondy/etc/security_config.json
security.allow_anonymous_user = on
security.automatically_create_realms = off
## Lowest PBKDF2 cost Bondy accepts (range 4096..65536, default 10000) to keep wampcra key derivation fast in tests
security.password.pbkdf2.iterations = 4096

## HTTP API gateway + WAMP-over-WebSocket at ws://host:18080/ws
api_gateway.http.enabled = on
api_gateway.http.port = 18080
api_gateway.https.enabled = off

## Admin REST API (http://host:18081/ping, /realms, ...)
admin_api.http.enabled = on
admin_api.http.port = 18081
admin_api.https.enabled = off

## WAMP RawSocket (TCP)
wamp.tcp.enabled = on
wamp.tcp.port = 18082
wamp.tls.enabled = off

cluster.peer_discovery.enabled = off

log.level = info

## Max WebSocket frame/message size (default 4MB; bigger messages => close 1009 "message too big").
## 0 = unbounded. Uncomment to test large payloads:
# wamp.websocket.max_frame_size = 64MB
